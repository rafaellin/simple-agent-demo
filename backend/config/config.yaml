# LLM配置
llm:
  provider: "openai"
  api_key: "${LLM_API_KEY}"
  model: "gpt-4o-mini"
  temperature: 0.7
  max_tokens: 2048

# Agent配置
agent:
  max_iterations: 5
  system_prompt: "system.md"
  tools_config: "tools.md"
  skills_config: "skills.md"

# MCP Server配置
mcp:
  name: "powershell-executor"
  command: "powershell.exe"
  args: ["-NoProfile", "-Command"]

# Workspace配置 (用户可自定义，这里用示例路径)
workspace:
  path: "f:/work/code/simple-agent-demo/agent-workspace"

# Gateway配置
gateway:
  host: "127.0.0.1"
  port: 8765
